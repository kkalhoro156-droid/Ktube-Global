<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K.TUBE GLOBAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial}
header{background:#e60023;padding:20px;font-size:25px;font-weight:bold}
nav{display:flex;justify-content:space-around;background:#222;padding:14px}
main{max-width:700px;margin:auto;padding:16px}
.card{background:#222;padding:16px;margin:15px 0;border-radius:12px}
input{width:100%;padding:13px;margin:8px 0;border:0;border-radius:8px}
button{width:100%;padding:13px;margin:6px 0;background:#e60023;color:white;border:0;border-radius:8px;font-weight:bold}
video{width:100%;border-radius:10px}
h2{color:#ff405b}
small{color:#aaa}
#status{overflow-wrap:anywhere;color:#76e6a0}
</style>
</head>
<body>
<header>▶ K.TUBE GLOBAL</header>
<nav><span>Home</span><span>Videos</span><span>Upload</span></nav>
<main>
<h2>Welcome to K.TUBE GLOBAL</h2>
<p>Your Global Video Sharing Platform</p>

<div class="card">
<h3>Login / Signup</h3>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password (6+ characters)">
<button onclick="signup()">Create Account</button>
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>
<p id="account">Checking account...</p>
</div>

<div class="card">
<h3>Upload Your Video</h3>
<input id="title" placeholder="Video title">
<input id="file" type="file" accept="video/*">
<button onclick="uploadVideo()">Upload Online</button>
<p id="status">Ready to upload</p>
</div>

<h2>Global Videos</h2>
<input id="search" placeholder="Search videos..." oninput="showVideos()">
<div id="videos">Loading...</div>
</main>

<script>
const PROJECT_URL="https://vslfjjxtcjsacklmafyc.supabase.co";
const API_KEY="sb_publishable_QOlKiET0bY9obKkGh0GwTQ_e3ESgC2Y";

const db=window.supabase.createClient(PROJECT_URL,API_KEY);
let user=null;
let allVideos=[];

async function checkUser(){
 const {data,error}=await db.auth.getUser();
 user=data?.user||null;
 document.getElementById("account").textContent=
 user?"Logged in: "+user.email:"Please login or create account";
}

async function signup(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||password.length<6){alert("Enter email and password of 6+ characters");return;}
 const {data,error}=await db.auth.signUp({email,password});
 if(error){alert(error.message);return;}
 alert(data.session?"Account created!":"Account created. Check your email to confirm.");
 await checkUser();
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error){alert(error.message);return;}
 await checkUser();
 alert("Login successful!");
}

async function logout(){
 await db.auth.signOut();
 await checkUser();
}

async function uploadVideo(){
 await checkUser();
 if(!user){alert("Please login first");return;}

 const file=document.getElementById("file").files[0];
 const title=document.getElementById("title").value.trim();
 const status=document.getElementById("status");

 if(!file||!title){alert("Enter title and select video");return;}
 if(!file.type.startsWith("video/")){alert("Select a video file");return;}
 if(file.size>50*1024*1024){alert("Maximum video size is 50 MB");return;}

 status.textContent="Uploading video...";
 const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
 const path=user.id+"/"+Date.now()+"_"+safeName;

 const {error:upError}=await db.storage
 .from("ktube-videos")
 .upload(path,file,{contentType:file.type});

 if(upError){status.textContent="Storage error: "+upError.message;return;}

 const {data:publicData}=db.storage
 .from("ktube-videos").getPublicUrl(path);

 const {error:dbError}=await db.from("videos").insert({
 user_id:user.id,
 title:title,
 video_url:publicData.publicUrl
 });

 if(dbError){
 status.textContent="Database error: "+dbError.message;
 return;
 }

 status.textContent="Video uploaded successfully!";
 document.getElementById("title").value="";
 document.getElementById("file").value="";
 await showVideos();
}

async function showVideos(){
 const box=document.getElementById("videos");
 const term=document.getElementById("search").value.toLowerCase();

 const {data,error}=await db.from("videos")
 .select("id,title,video_url,created_at")
 .order("created_at",{ascending:false});

 if(error){box.textContent="Video loading error: "+error.message;return;}

 allVideos=data||[];
 box.innerHTML="";

 const found=allVideos.filter(v=>(v.title||"").toLowerCase().includes(term));

 if(!found.length){box.textContent="No videos available yet.";return;}

 found.forEach(v=>{
 const card=document.createElement("div");
 card.className="card";
 const heading=document.createElement("h3");
 heading.textContent=v.title;
 const player=document.createElement("video");
 player.src=v.video_url;
 player.controls=true;
 player.playsInline=true;
 player.preload="metadata";
 card.append(heading,player);
 box.appendChild(card);
 });
}

db.auth.onAuthStateChange(()=>checkUser());
checkUser().then(showVideos);
</script>
</body>
</html>
