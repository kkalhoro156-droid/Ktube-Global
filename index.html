<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K.TUBE GLOBAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:white;font-family:Arial}
header{background:#181818;padding:14px;display:flex;gap:10px;align-items:center;position:sticky;top:0}
.logo{color:#ff263f;font-size:22px;font-weight:bold;white-space:nowrap}
input,textarea,select{background:#292929;color:white;border:1px solid #444;padding:12px;border-radius:8px;width:100%;margin:6px 0}
button{background:#ff263f;color:white;border:0;padding:11px;border-radius:8px;cursor:pointer;margin:3px}
.search{display:flex;flex:1}.search input{border-radius:20px 0 0 20px}.search button{border-radius:0 20px 20px 0}
nav{display:flex;gap:7px;overflow:auto;padding:12px;background:#181818}
nav button{white-space:nowrap;background:#333}
main{padding:15px;max-width:1200px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.item{cursor:pointer}.thumb{width:100%;aspect-ratio:16/9;background:#292929;border-radius:10px;object-fit:cover}
.item h3{font-size:15px;margin:8px 0}.muted{color:#aaa;font-size:13px}
.card{background:#1d1d1d;padding:16px;border-radius:12px;margin:12px 0}
video{width:100%;max-height:65vh;background:black;border-radius:10px}
.hidden{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap}
.avatar{background:#ff263f;border-radius:50%;padding:10px;display:inline-block}
@media(max-width:600px){main{padding:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.logo{font-size:17px}header{padding:9px}}
</style>
</head>
<body>
<header>
 <div class="logo">▶ K.TUBE</div>
 <div class="search">
  <input id="search" placeholder="Search videos..." oninput="loadVideos()">
  <button onclick="loadVideos()">⌕</button>
 </div>
 <button onclick="authPage()">Sign in</button>
</header>
<nav id="cats"></nav>
<main>
<section id="home">
 <h2>Explore Videos</h2>
 <div id="videos" class="grid">Loading...</div>
</section>

<section id="auth" class="hidden">
 <div class="card">
  <h2>Login / Signup</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password (6+ characters)">
  <button onclick="signup()">Create Account</button>
  <button onclick="login()">Sign In</button>
  <button onclick="googleLogin()">Google Login</button>
  <button onclick="logout()">Logout</button>
  <p id="authStatus"></p>
 </div>
</section>

<section id="upload" class="hidden">
 <div class="card">
  <h2>Upload Video</h2>
  <input id="title" placeholder="Video title">
  <textarea id="desc" placeholder="Description"></textarea>
  <select id="category">
   <option>All Videos</option><option>Hollywood Movies</option>
   <option>Bollywood Movies</option><option>Pakistani Songs</option>
   <option>Sindhi Songs</option><option>Other Songs</option>
   <option>Islamic / Quran / Naat</option><option>Dramas</option>
   <option>Cartoons</option><option>Documentaries</option>
   <option>News</option><option>Other Videos</option>
  </select>
  <label>Video file</label><input id="file" type="file" accept="video/*">
  <label>Thumbnail image</label><input id="thumb" type="file" accept="image/*">
  <button onclick="uploadVideo()">Upload Online</button>
  <p id="status"></p>
 </div>
</section>

<section id="watch" class="hidden">
 <button onclick="homePage()">← Back</button>
 <div class="card">
  <video id="player" controls playsinline></video>
  <h2 id="vtitle"></h2>
  <p id="vdesc" class="muted"></p>
  <p id="vchannel"></p>
  <div class="row">
   <button id="like" onclick="likeVideo()">👍 Like</button>
   <button id="sub" onclick="subscribe()">＋ Subscribe</button>
  </div>
  <h3>Comments</h3>
  <textarea id="comment" placeholder="Write comment..."></textarea>
  <button onclick="addComment()">Post Comment</button>
  <div id="comments"></div>
 </div>
</section>

<section id="profile" class="hidden">
 <div class="card">
  <h2>My Channel</h2>
  <input id="channelName" placeholder="Channel name">
  <textarea id="channelDesc" placeholder="Channel description"></textarea>
  <button onclick="saveProfile()">Save Profile</button>
  <p id="profileStatus"></p>
 </div>
</section>
</main>

<script>
const URL="https://vslfjjxtcjsacklmafyc.supabase.co";
const KEY="sb_publishable_QOlKiET0bY9obKkGh0GwTQ_e3ESgC2Y";
const db=supabase.createClient(URL,KEY);
let user=null, videos=[], current=null, category="All Videos", profiles={};

const categories=["All Videos","Hollywood Movies","Bollywood Movies","Pakistani Songs","Sindhi Songs","Other Songs","Islamic / Quran / Naat","Dramas","Cartoons","Documentaries","News","Other Videos"];

function safe(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function page(id){["home","auth","upload","watch","profile"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));}
function homePage(){history.pushState({},"",location.pathname);page("home");loadVideos();}
function authPage(){page("auth");}
function uploadPage(){if(!user)return authPage();page("upload");}
function profilePage(){if(!user)return authPage();page("profile");getProfile();}
function makeCats(){
 document.getElementById("cats").innerHTML=categories.map(c=>
 `<button onclick="chooseCategory('${safe(c)}')">${safe(c)}</button>`).join("");
}
function chooseCategory(c){category=c;loadVideos();}

async function checkUser(){
 const {data}=await db.auth.getUser();user=data.user;
 document.querySelector("header button").textContent=user?"Account":"Sign in";
 document.querySelector("header button").onclick=user?profilePage:authPage;
}
async function signup(){
 let email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 if(!email||password.length<6)return alert("Enter email and password (6+ characters)");
 const {error}=await db.auth.signUp({email,password});
 document.getElementById("authStatus").textContent=error?error.message:"Account created. Check email if confirmation is required.";
 await checkUser();
}
async function login(){
 const {error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});
 if(error)return alert(error.message);
 await checkUser();homePage();
}
async function googleLogin(){
 const {error}=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:"https://kkalhoro156-droid.github.io/Ktube-Global/"}});
 if(error)alert(error.message);
}
async function logout(){await db.auth.signOut();await checkUser();homePage();}

async function loadVideos(){
 const box=document.getElementById("videos");box.innerHTML="Loading...";
 const {data,error}=await db.from("videos").select("*").order("created_at",{ascending:false});
 if(error){box.textContent=error.message;return;}
 videos=data||[];
 const ids=[...new Set(videos.map(v=>v.user_id).filter(Boolean))];
 profiles={};
 if(ids.length){
  const {data:p}=await db.from("profiles").select("id,full_name,username").in("id",ids);
  (p||[]).forEach(x=>profiles[x.id]=x);
 }
 const term=document.getElementById("search").value.toLowerCase();
 const found=videos.filter(v=>{
  const name=profiles[v.user_id]?.full_name||profiles[v.user_id]?.username||"Creator";
  return (category==="All Videos"||v.category===category)&&
  ((v.title||"").toLowerCase().includes(term)||name.toLowerCase().includes(term));
 });
 box.innerHTML="";
 if(!found.length){box.textContent="No videos found.";return;}
 found.forEach(v=>{
  let name=profiles[v.user_id]?.full_name||profiles[v.user_id]?.username||"K.TUBE Creator";
  let div=document.createElement("div");div.className="item";
  div.innerHTML=`<img class="thumb" src="${safe(v.thumbnail_url||"")}" onerror="this.style.display='none'">
  <h3>${safe(v.title)}</h3><div class="muted">${safe(name)} · ${safe(v.category||"Videos")}</div>`;
  div.onclick=()=>openVideo(v.id);box.appendChild(div);
 });
}

async function uploadVideo(){
 if(!user)return authPage();
 let f=file.files[0],t=title.value.trim();
 if(!f||!t)return alert("Enter title and select video");
 if(!f.type.startsWith("video/")||f.size>50*1024*1024)return alert("Video must be valid and under 50 MB");
 status.textContent="Uploading...";
 try{
  let path=user.id+"/"+Date.now()+"_"+f.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  let {error}=await db.storage.from("ktube-videos").upload(path,f,{contentType:f.type});
  if(error)throw error;
  let videoUrl=db.storage.from("ktube-videos").getPublicUrl(path).data.publicUrl;
  let imageUrl=null,im=thumb.files[0];
  if(im){
   if(!im.type.startsWith("image/"))throw Error("Choose an image thumbnail");
   let ip=user.id+"/thumb_"+Date.now()+"_"+im.name.replace(/[^a-zA-Z0-9._-]/g,"_");
   let r=await db.storage.from("ktube-videos").upload(ip,im,{contentType:im.type});
   if(r.error)throw r.error;
   imageUrl=db.storage.from("ktube-videos").getPublicUrl(ip).data.publicUrl;
  }
  let result=await db.from("videos").insert({user_id:user.id,title:t,description:desc.value,category:categorySelect(),video_url:videoUrl,thumbnail_url:imageUrl});
  if(result.error)throw result.error;
  status.textContent="Video uploaded!";
  page("home");loadVideos();
 }catch(e){status.textContent="Error: "+e.message;}
}
function categorySelect(){return document.getElementById("category").value;}

async function openVideo(id){
 current=videos.find(v=>v.id===id);if(!current)return;
 history.pushState({},"","?v="+id);page("watch");
 player.src=current.video_url;vtitle.textContent=current.title;
 vdesc.textContent=current.description||"";
 vchannel.textContent="Channel: "+(profiles[current.user_id]?.full_name||"K.TUBE Creator");
 await loadLikes();await loadComments();await loadSub();
}
async function loadLikes(){
 const {data}=await db.from("likes").select("id,user_id").eq("video_id",current.id);
 let rows=data||[];
 like.textContent="👍 Like ("+rows.length+")";
 like.style.background=user&&rows.some(x=>x.user_id===user.id)?"#ff263f":"#444";
}
async function likeVideo(){
 if(!user)return authPage();
 let {data}=await db.from("likes").select("id").eq("video_id",current.id).eq("user_id",user.id).maybeSingle();
 let r=data?await db.from("likes").delete().eq("id",data.id):await db.from("likes").insert({video_id:current.id,user_id:user.id});
 if(r.error)alert(r.error.message);else loadLikes();
}
async function loadComments(){
 const box=document.getElementById("comments");
 const {data,error}=await db.from("comments").select("*").eq("video_id",current.id).order("created_at",{ascending:false});
 box.innerHTML=error?safe(error.message):(data||[]).map(c=>`<div class="card">${safe(c.content)}</div>`).join("")||"No comments yet.";
}
async function addComment(){
 if(!user)return authPage();
 let content=comment.value.trim();if(!content)return;
 const {error}=await db.from("comments").insert({video_id:current.id,user_id:user.id,content});
 if(error)alert(error.message);else{comment.value="";loadComments();}
}
async function loadSub(){
 if(!user)return;
 let {data}=await db.from("subscriptions").select("id").eq("subscriber_id",user.id).eq("channel_id",current.user_id).maybeSingle();
 sub.textContent=data?"Subscribed":"＋ Subscribe";
}
async function subscribe(){
 if(!user)return authPage();
 if(user.id===current.user_id)return alert("This is your own channel");
 let {data}=await db.from("subscriptions").select("id").eq("subscriber_id",user.id).eq("channel_id",current.user_id).maybeSingle();
 let r=data?await db.from("subscriptions").delete().eq("id",data.id):await db.from("subscriptions").insert({subscriber_id:user.id,channel_id:current.user_id});
 if(r.error)alert(r.error.message);else loadSub();
}
async function getProfile(){
 const {data}=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();
 channelName.value=data?.full_name||data?.username||"";
 channelDesc.value=data?.channel_description||"";
}
async function saveProfile(){
 const {error}=await db.from("profiles").upsert({id:user.id,full_name:channelName.value.trim(),channel_description:channelDesc.value.trim()});
 profileStatus.textContent=error?error.message:"Channel saved!";
}
window.onpopstate=()=>{let id=new URLSearchParams(location.search).get("v");if(id)openVideo(id);else homePage();};
db.auth.onAuthStateChange(()=>checkUser());
makeCats();checkUser().then(loadVideos);
</script>
</body>
</html>
